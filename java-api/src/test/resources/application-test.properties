# H2 em modo Oracle, carregando os mesmos scripts da entrega de Database.
spring.datasource.url=jdbc:h2:mem:varzea;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:db/01_ddl.sql
spring.sql.init.data-locations=classpath:db/02_dml.sql
spring.jpa.defer-datasource-initialization=false
varzea.jwt.segredo=chave-somente-para-os-testes-automatizados-0123456789
