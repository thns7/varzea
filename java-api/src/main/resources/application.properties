spring.application.name=varzea-api
server.port=${PORT:8080}

# Credenciais do Oracle da FIAP: sempre por variável de ambiente, nunca no código.
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${ORACLE_USER:}
spring.datasource.password=${ORACLE_PASSWORD:}

# Poucas conexões, pois o servidor é compartilhado. A API sobe mesmo com o banco fora do ar,
# e /api/status informa a situação.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=-1

varzea.cors.origens=${CORS_ORIGENS:https://varzea-flame.vercel.app,http://localhost:5173}

server.error.include-message=never
server.error.include-stacktrace=never
