spring.application.name=varzea-api
server.port=${PORT:8080}

# Oracle da FIAP. Usuário e senha sempre por variável de ambiente, nunca no código.
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${ORACLE_USER:}
spring.datasource.password=${ORACLE_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# As tabelas são criadas pelos scripts de database/, então o Hibernate não altera o esquema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Poucas conexões, pois o servidor é compartilhado. A API sobe mesmo com o banco fora do ar,
# e /api/status informa a situação.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# JWT: a chave vem de variável de ambiente. Sem ela, a API gera uma chave temporária ao iniciar.
varzea.jwt.segredo=${JWT_SEGREDO:}
varzea.jwt.expiracao-ms=${JWT_EXPIRACAO_MS:86400000}

varzea.cors.origens=${CORS_ORIGENS:https://varzea-flame.vercel.app,http://localhost:5173}

server.error.include-message=never
server.error.include-stacktrace=never
